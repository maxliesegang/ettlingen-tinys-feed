name: Mittagstisch aktualisieren

on:
  # Geplante Läufe kommen von einem externen Cron-Dienst (Mo–Fr alle 30 Minuten, 09:00–11:00
  # Berliner Zeit, siehe README) per workflow_dispatch mit "scheduled". GitHubs eigener Zeitplan
  # startet teils Stunden zu spät; src/slot.ts ordnet Läufe nach ihrer Startzeit zu.
  workflow_dispatch:
    inputs:
      force:
        description: "Senden, auch wenn heute schon gesendet wurde oder das Datum nicht passt"
        type: boolean
        default: false
      scheduled:
        description: "Geplanter Lauf (setzt der externe Cron-Dienst) – für manuelle Läufe leer lassen"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["src/**", "test/**", "package*.json", "tsconfig.json"]

permissions:
  contents: read

jobs:
  # Bei Code-Pushes nur prüfen, nicht abrufen und nichts senden.
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Ordnet den Lauf dem Zeitfenster zu (src/slot.ts, direkt mit Node, ohne npm ci). Läufe außerhalb
  # enden hier – noch vor der concurrency-Gruppe, damit sie keinen wartenden Lauf verdrängen.
  slot:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: src/slot.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Zeitfenster prüfen
        id: slot
        run: |
          slot=$(node src/slot.ts)
          echo "Lauf: $slot"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
        env:
          SCHEDULED: ${{ inputs.scheduled }}

  # Abrufen, senden und veröffentlichen in einem Job: Der nächste Lauf startet erst, wenn das neue
  # today.json online ist, und liest daraus, ob heute schon gesendet wurde.
  update:
    needs: slot
    if: needs.slot.outputs.slot != 'skip'
    runs-on: ubuntu-latest
    concurrency:
      group: mittagstisch
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write # GitHub Pages veröffentlichen
      id-token: write # von actions/deploy-pages benötigt
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck & Tests
        run: |
          npm run typecheck
          npm test

      # Liefert die Pages-URL (berücksichtigt auch eine eigene Domain).
      - name: Pages konfigurieren
        id: pages
        uses: actions/configure-pages@v6

      # Schlägt der Lauf fehl (letzter Versuch ohne Versand), wird public/ trotzdem veröffentlicht,
      # falls gebaut; der Fehler wird erst im letzten Schritt gemeldet.
      - name: Menü abrufen, Feed bauen, Webhooks senden
        id: build
        run: |
          rc=0
          npm run feed -- ${{ inputs.force && '--force' || '' }} || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Ohne neues Menü entsteht kein public/ – dann bleibt die bisherige Seite online.
          echo "built=$([ -f public/today.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          WEBHOOK_URLS: ${{ secrets.WEBHOOK_URLS }}
          WEBHOOK_PAYLOAD: ${{ vars.WEBHOOK_PAYLOAD || 'slack' }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Zuordnung aus dem slot-Job, nicht neu berechnet: Der Lauf könnte inzwischen über END sein.
          SLOT: ${{ needs.slot.outputs.slot }}

      - name: Pages-Artefakt hochladen
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        if: steps.build.outputs.built == 'true'
        uses: actions/deploy-pages@v5

      - name: Fehler melden
        if: steps.build.outputs.rc != '0'
        run: exit 1
