name: Mittagstisch aktualisieren

on:
  schedule:
    # Ziel: Mo–Fr alle 30 Minuten von 09:25 bis 11:25 Uhr deutscher Zeit (11:30 öffnet das Restaurant).
    # Bewusst kurz vor :00 und :30: Zur vollen und halben Stunde startet GitHub geplante Läufe oft
    # stark verspätet oder gar nicht.
    # GitHub rechnet in UTC, daher decken die Trigger Sommer- (UTC+2) und Winterzeit (UTC+1) ab;
    # slotOf() in src/slot.ts lässt nur die zur aktuellen Zeitzone passenden weiterlaufen.
    # Je ein Eintrag pro Uhrzeit, damit der Lauf weiß, zu welchem Termin er gehört.
    - cron: "25 7 * * 1-5"
    - cron: "55 7 * * 1-5"
    - cron: "25 8 * * 1-5"
    - cron: "55 8 * * 1-5"
    - cron: "25 9 * * 1-5"
    - cron: "55 9 * * 1-5"
    - cron: "25 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Senden, auch wenn heute schon gesendet wurde oder das Datum nicht passt"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["src/**", "test/**", "package*.json", "tsconfig.json"]

permissions:
  contents: read

jobs:
  # Bei Code-Pushes nur prüfen, nicht abrufen und nichts senden.
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Ordnet den Lauf dem Zeitfenster zu (src/slot.ts, direkt mit Node, ohne npm ci). Läufe außerhalb
  # enden hier – noch vor der concurrency-Gruppe, damit sie keinen wartenden Lauf verdrängen.
  slot:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # Workflow regelmäßig reaktivieren (siehe "Zeitplan aktiv halten")
    outputs:
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: src/slot.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Zeitfenster prüfen
        id: slot
        run: |
          slot=$(node src/slot.ts)
          echo "Lauf: $slot"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
        env:
          SCHEDULE: ${{ github.event.schedule }}

      # Ohne Commits pausiert GitHub geplante Workflows nach 60 Tagen ohne Repo-Aktivität.
      # Das erneute Aktivieren per API setzt diesen Zähler zurück.
      - name: Zeitplan aktiv halten
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  # Abrufen, senden und veröffentlichen in einem Job: Der nächste Lauf startet erst, wenn das neue
  # today.json online ist, und liest daraus, ob heute schon gesendet wurde.
  update:
    needs: slot
    if: needs.slot.outputs.slot != 'skip'
    runs-on: ubuntu-latest
    concurrency:
      group: mittagstisch
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write # GitHub Pages veröffentlichen
      id-token: write # von actions/deploy-pages benötigt
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck & Tests
        run: |
          npm run typecheck
          npm test

      # Liefert die Pages-URL (berücksichtigt auch eine eigene Domain).
      - name: Pages konfigurieren
        id: pages
        uses: actions/configure-pages@v6

      # Schlägt der Lauf fehl (letzter Versuch ohne Versand), wird public/ trotzdem veröffentlicht,
      # falls gebaut; der Fehler wird erst im letzten Schritt gemeldet.
      - name: Menü abrufen, Feed bauen, Webhooks senden
        id: build
        run: |
          rc=0
          npm run feed -- ${{ inputs.force && '--force' || '' }} || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Ohne neues Menü entsteht kein public/ – dann bleibt die bisherige Seite online.
          echo "built=$([ -f public/today.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          WEBHOOK_URLS: ${{ secrets.WEBHOOK_URLS }}
          WEBHOOK_PAYLOAD: ${{ vars.WEBHOOK_PAYLOAD || 'slack' }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          SCHEDULE: ${{ github.event.schedule }}

      - name: Pages-Artefakt hochladen
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        if: steps.build.outputs.built == 'true'
        uses: actions/deploy-pages@v5

      - name: Fehler melden
        if: steps.build.outputs.rc != '0'
        run: exit 1
