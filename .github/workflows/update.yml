name: Mittagstisch aktualisieren

on:
  schedule:
    # Ziel: einmal täglich 10:30 Uhr deutscher Zeit. GitHub rechnet in UTC, daher zwei
    # Trigger; der Schritt "Zeitfenster prüfen" lässt nur den zur aktuellen Zeitzone passenden durch.
    - cron: "30 8 * * 1-5"   # 10:30 MESZ (Sommerzeit, UTC+2)
    - cron: "30 9 * * 1-5"   # 10:30 MEZ  (Winterzeit, UTC+1)
  workflow_dispatch:
    inputs:
      force:
        description: "Webhook auch ohne Änderung senden"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["src/**", "test/**", "package*.json", "tsconfig.json"]

permissions:
  contents: read
  actions: write    # Workflow regelmäßig reaktivieren (siehe "Zeitplan aktiv halten")
  pages: write      # GitHub Pages veröffentlichen
  id-token: write   # von actions/deploy-pages benötigt

concurrency:
  group: mittagstisch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck & Tests
        run: |
          npm run typecheck
          npm test

      # Nur der Cron-Trigger, der zur aktuellen deutschen UTC-Abweichung passt, läuft weiter.
      # Richtet sich nach dem ausgelösten Cron statt nach der Uhrzeit, weil GitHub geplante
      # Läufe oft verspätet startet.
      - name: Zeitfenster prüfen
        id: gate
        run: |
          if [ "$EVENT" = "push" ]; then run=false
          elif [ "$EVENT" != "schedule" ]; then run=true
          else
            case "$(TZ=Europe/Berlin date +%z)/$SCHEDULE" in
              "+0200/30 8 * * 1-5"|"+0100/30 9 * * 1-5") run=true ;;
              *) run=false; echo "Nicht 10:30 Uhr deutscher Zeit – übersprungen." ;;
            esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}

      # Liefert die Pages-URL (berücksichtigt auch eine eigene Domain).
      - name: Pages konfigurieren
        id: pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v6

      # Bei Code-Pushes nur prüfen, nicht abrufen und nichts senden.
      - name: Menü abrufen, Feed bauen, Webhooks senden
        id: build
        if: steps.gate.outputs.run == 'true'
        run: |
          npm run feed -- ${{ inputs.force && '--force' || '' }}
          # Ohne heutiges Menü entsteht kein public/ – dann bleibt die bisherige Seite online.
          echo "built=$([ -f public/today.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          WEBHOOK_URLS: ${{ secrets.WEBHOOK_URLS }}
          WEBHOOK_PAYLOAD: ${{ vars.WEBHOOK_PAYLOAD || 'slack' }}
          FEED_URL: ${{ steps.pages.outputs.base_url }}/feed.xml

      - name: Pages-Artefakt hochladen
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      # Ohne Commits pausiert GitHub geplante Workflows nach 60 Tagen ohne Repo-Aktivität.
      # Das erneute Aktivieren per API setzt diesen Zähler zurück.
      - name: Zeitplan aktiv halten
        if: github.event_name == 'schedule'
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: update
    if: needs.update.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
